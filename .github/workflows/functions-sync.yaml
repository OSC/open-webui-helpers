name: Sync Functions to Open WebUI

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - filters/**.py
      - scripts/**.py
      - Makefile
      - requirements*.txt
      - .github/workflows/functions-sync.yaml
  pull_request:
      paths:
      - filters/**.py
      - scripts/**.py
      - Makefile
      - requirements*.txt
      - .github/workflows/functions-sync.yaml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      github.repository == 'OSC/open-webui-helpers'
    permissions:
      actions: write
      checks: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Trigger Test Workflow
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run test.yaml \
            --ref ${{ github.ref_name }} \

      - name: Wait for Test Workflow
        uses: ArcticLampyrid/action-wait-for-workflow@v1
        with:
          workflow: test.yaml

      - name: Sync functions (test)
        if: github.ref_type != 'tag'
        env:
          WEBUI_URL: https://${{ secrets.OPEN_WEBUI_HOST_TEST }}
          WEBUI_TOKEN: ${{ secrets.OPEN_WEBUI_KEY_TEST }}
          VERSION: ${{ github.sha }}
        run: |
          scripts/sync-functions.py

      - name: Sync functions (prod)
        if: github.ref_type == 'tag'
        env:
          WEBUI_URL: https://${{ secrets.OPEN_WEBUI_HOST_PROD }}
          WEBUI_TOKEN: ${{ secrets.OPEN_WEBUI_KEY_PROD }}
          VERSION: ${{ github.ref_name }}
        run: |
          scripts/sync-functions.py
