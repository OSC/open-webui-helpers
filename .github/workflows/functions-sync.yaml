name: Sync Functions to Open WebUI

on:
  workflow_run:
    workflows: ["Lint and Test"]
    types:
      - completed

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: 'pip'
