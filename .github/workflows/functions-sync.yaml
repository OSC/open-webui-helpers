name: Sync Functions to Open WebUI

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - filters/**.py
      - scripts/**.py
      - requirements*.txt
      - .github/workflows/functions-sync.yaml
  pull_request:
      paths:
      - filters/**.py
      - scripts/**.py
      - requirements*.txt
      - .github/workflows/functions-sync.yaml

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      github.repository == 'OSC/open-webui-helpers'
    permissions:
      actions: read
      checks: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.16'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Wait for Test Workflow
        uses: ArcticLampyrid/action-wait-for-workflow@v1
        with:
          workflow: test.yaml

      - name: Deploy via Python Script
        env:
          WEBUI_URL: https://${{ github.ref_type == 'tag' && secrets.OPEN_WEBUI_HOST_PROD || secrets.OPEN_WEBUI_HOST_TEST }}
          WEBUI_TOKEN: ${{ github.ref_type == 'tag' && secrets.OPEN_WEBUI_KEY_PROD || secrets.OPEN_WEBUI_KEY_TEST }}
        run: |
          scripts/sync-filters.py
